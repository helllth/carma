<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PR Deployment Not Found</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      .container {
        background: white;
        padding: 3rem;
        border-radius: 1rem;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 600px;
        text-align: center;
      }
      h1 {
        color: #333;
        margin-bottom: 1rem;
      }
      p {
        color: #666;
        line-height: 1.6;
      }
      .pr-link {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.75rem 2rem;
        background: #667eea;
        color: white;
        text-decoration: none;
        border-radius: 0.5rem;
        font-weight: 600;
        transition: background 0.3s;
      }
      .pr-link:hover {
        background: #764ba2;
      }
      .url-info {
        background: #f5f5f5;
        padding: 1rem;
        border-radius: 0.5rem;
        margin-top: 1rem;
        font-family: monospace;
        font-size: 0.9rem;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔍 PR Deployment Not Available</h1>
      <p>
        This preview deployment is no longer available. It was likely removed
        when the pull request was closed or merged.
      </p>
      <div class="url-info" id="urlInfo"></div>
      <div id="prLink"></div>
    </div>

    <script>
      // Extract PR number and project from URL
      const path = window.location.pathname;
      const match = path.match(/\/(\d+)\/([^\/]+)/);

      if (match) {
        const prNumber = match[1];
        const projectName = match[2];

        document.getElementById(
          "urlInfo"
        ).innerHTML = `Requested: <strong>PR #${prNumber}</strong> - Project: <strong>${projectName}</strong>`;

        document.getElementById(
          "prLink"
        ).innerHTML = `<a href="https://github.com/helllth/carma/pull/${prNumber}" class="pr-link">
                    View Pull Request #${prNumber} →
                </a>`;
      } else {
        document.getElementById("urlInfo").innerHTML =
          "Could not determine PR number from URL";
      }
    </script>
  </body>
</html>
